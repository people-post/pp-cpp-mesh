name: build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C++ formatting (clang-format 23.1.5)
        run: |
          pipx install clang-format==23.1.5
          ./scripts/check_format.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Layer check
        if: runner.os == 'Linux'
        run: scripts/check_layers.sh

      - name: Configure
        shell: bash
        run: |
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DPP_MESH_BUILD_TESTS=ON \
            "${generator[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  # UPnP is off by default; keep it compiling.
  upnp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DPP_MESH_WITH_UPNP=ON
      - name: Build
        run: cmake --build build -j 2 --target pp_mesh_reachability

  # AddressSanitizer + LeakSanitizer + UBSan over the whole suite (as pp-cpp-amp): ownership cycles
  # and use-after-frees pass every other job silently — self-owning park waits leaked each punch's
  # callbacks and session until a local sanitizer run found them.
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug \
            -DPP_MESH_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 4
